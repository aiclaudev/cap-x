# Usage: uv run capx/envs/launch.py --config-path env_configs/nut_assembly/franka_robosuite_nut_assembly_multiturn_vdm_privileged_api.yaml
#
# PI (privileged / ground-truth pose) counterpart of
#   franka_robosuite_nut_assembly_multiturn_vdm_reduced_api_skill_lib.yaml
# Only the agent-facing API changes: FrankaControlNutAssemblyPrivilegedApi exposes get_object_pose /
# get_nut_handle_to_center_offset / sample_grasp_pose / goto_pose backed by GROUND-TRUTH sim state,
# so the generated code never touches SAM3 / ContactGraspNet. Everything else (multi-turn loop, the
# local-Qwen3.6 VDM held constant as the control variable, vdm_goal_only) is identical to the
# perception run, so the perception->PI delta is the only thing that moves.

env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_nut_assembly_low_level_visual  # visual: VDM + video still need rendered images
    privileged: true
    apis:
      - FrankaControlNutAssemblyPrivilegedApi
    # prompt is inherited from FrankaNutAssemblyCodeEnv class default (describes the privileged get_object_pose/goto_pose API)
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Consider querying the environment state through tool calls and prints to see if the task is completed.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  # NOTE: no SAM3 / ContactGraspNet servers — the privileged API reads GT poses directly.

record_video: true
output_dir: ./outputs/franka_robosuite_nut_assembly_multiturn_vdm_privileged_api
use_img_differencing: true
save_multiturn_prompts: true
vdm_goal_only: true   # feed the VDM only the task goal, not the full code-gen prompt + API docs
trials: 100
num_workers: 12
