# agentv2 (Reflector + multi-view) — generated from the agentv1 config.
# views: ['robot0_robotview', 'robot0_eye_in_hand', 'frontview']
env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_restack_low_level
    privileged: false
    apis:
    - FrankaControlApiReducedSkillLibrary
    prompt: 'NOTE: This task provides MULTIPLE camera views. get_observation() returns a separate entry for each of: robot0_robotview, robot0_eye_in_hand, frontview. Each entry has [''images''][''rgb''], [''images''][''depth''], [''intrinsics''], [''pose_mat''] just like robot0_robotview. You may run perception (segment_sam3_text_prompt, plan_grasp, mask_to_world_points, etc.) on ANY of these views to get better coverage and angles; pick the view(s) best suited to what you need to see.


      You are controlling a Franka Emika robot with API described below.

      Goal: place the red cube on top of the green cube and then open the gripper.

      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.

      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.

      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

      '
    multi_turn_prompt: 'The following code blocks were just executed:

      ```python

      {executed_code}

      ```

      The current console stdout is:

      ```

      {console_stdout}

      ```

      The current console stderr is:

      ```

      {console_stderr}

      ```

      '
    render_camera_names:
    - robot0_robotview
    - robot0_eye_in_hand
    - frontview
api_servers:
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
- _target_: capx.serving.launch_contact_graspnet_server.main
  port: 8115
  host: 127.0.0.1
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
model: google/gemini-3.1-pro-preview
reflector_model: google/gemini-3.1-pro-preview
reasoning_effort: low
use_reflector: true
version: agentv2
record_video: true
save_multiturn_prompts: true
output_dir: ./outputs/franka_robosuite_cube_restack
trials: 1
num_workers: 1
