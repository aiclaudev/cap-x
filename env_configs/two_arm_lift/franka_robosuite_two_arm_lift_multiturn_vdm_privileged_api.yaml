# Usage: uv run capx/envs/launch.py --config-path env_configs/two_arm_lift/franka_robosuite_two_arm_lift_multiturn_vdm_privileged_api.yaml
#
# PI (privileged / ground-truth pose) counterpart of
#   franka_robosuite_two_arm_lift_multiturn_vdm_reduced_api_skill_lib.yaml
# Agent-facing API swaps to FrankaTwoArmLiftPrivilegedApi (GT pot/handle poses + dual-arm goto_pose),
# so the generated code never touches SAM3 / ContactGraspNet. Multi-turn loop + local-Qwen3.6 VDM
# (held constant as the control) + vdm_goal_only are identical to the perception run.

env:
  _target_: capx.envs.tasks.franka.two_arm_lift.TwoArmLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: two_arm_lift_robosuite
    privileged: true
    apis:
      - FrankaTwoArmLiftPrivilegedApi
    # prompt inherited from TwoArmLiftCodeEnv class default (describes the privileged dual-arm API)
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Consider querying the environment state through tool calls and prints to see if the task is completed.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  # NOTE: no SAM3 / ContactGraspNet — privileged API reads GT poses directly.

record_video: true
output_dir: ./outputs/franka_robosuite_two_arm_lift_multiturn_vdm_privileged_api
use_img_differencing: true
save_multiturn_prompts: true
vdm_goal_only: true
trials: 100
num_workers: 12
