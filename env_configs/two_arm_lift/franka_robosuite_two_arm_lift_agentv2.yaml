# agentv2 (Reflector + multi-view) — generated from the agentv1 config.
# views: ['agentview', 'robot0_eye_in_hand', 'robot1_eye_in_hand']
env:
  _target_: capx.envs.tasks.franka.two_arm_lift.TwoArmLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: two_arm_lift_robosuite
    apis:
    - FrankaControlApiReducedSkillLibraryBimanual
    prompt: "IMPORTANT — MULTIPLE CAMERA VIEWS ARE AVAILABLE. get_observation() returns a dict with a\nSEPARATE entry for EACH of these views: agentview, robot0_eye_in_hand, robot1_eye_in_hand.\nEach entry has [\"images\"][\"rgb\"], [\"images\"][\"depth\"], [\"intrinsics\"], [\"pose_mat\"] exactly\nlike robot0_robotview. Different views see the scene from different angles — a wrist view\n(robot0_eye_in_hand) gives a close-up of the gripper/object, a scene view gives global layout.\nUSE the view(s) that best see what you need; do NOT restrict yourself to one view. Example:\n    obs = get_observation()\n    rgb_scene = obs[\"agentview\"][\"images\"][\"rgb\"]\n    rgb_wrist0 = obs[\"robot0_eye_in_hand\"][\"images\"][\"rgb\"]\n    rgb_wrist1 = obs[\"robot1_eye_in_hand\"][\"images\"][\"rgb\"]\n    # run perception on whichever view sees the target best (here the close-up):\n    masks = segment_sam3_text_prompt(rgb_wrist0, \"the pot handle\")\n    # depth/intrinsics/pose_mat of that same view\
      \ are obs[\"robot0_eye_in_hand\"][\"images\"][\"depth\"], etc.\n\nYou are controlling a two-arm Franka Emika robot system on opposite sides of the table with API described below.\nGoal: The two arms should coordinate to lift a pot. Arm 0 should grasp handle 0, and Arm 1 should grasp handle 1. Then both arms should lift the pot up at the same height.\n\nGuidance:\n- The pot is in the center of the table and has two handles on opposite sides.\n- One handle0 is green and the other handle1 is blue, and the main body of the pot is red.\n- You may want to slightly lift both arms first to avoid occluding the pot and handles.\n- Avoid using top-down grasps, i.e. avoid using quaternion wxyz [0, 0, 1, 0] for the approach.\n- Sideways grasps are preferred with the y-axis of the gripper aligned with the world z-axis.\n- Coordinate system: All pose functions accept/return positions in robot0's base frame.\n\nYou may write python code comments for reasoning but ONLY write the executable Python code\
      \ and do not write it in code fences.\nAfter this code executes, you will receive the current console stdout and stderr (any errors or print statements made in the code). You will then have the chance to write new code to query the environment state and/or complete the task.\nThe functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.\n"
    multi_turn_prompt: 'The following code blocks were just executed:

      ```python

      {executed_code}

      ```

      The current console stdout is:

      ```

      {console_stdout}

      ```

      The current console stderr is:

      ```

      {console_stderr}

      ```

      '
    render_camera_names:
    - agentview
    - robot0_eye_in_hand
    - robot1_eye_in_hand
api_servers:
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
- _target_: capx.serving.launch_contact_graspnet_server.main
  port: 8115
  host: 127.0.0.1
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
model: google/gemini-3.1-pro-preview
reflector_model: google/gemini-3.1-pro-preview
reasoning_effort: low
use_reflector: true
version: agentv2
record_video: true
save_multiturn_prompts: true
output_dir: ./outputs/franka_robosuite_two_arm_lift
trials: 1
num_workers: 1
